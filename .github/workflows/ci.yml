name: CI

on:
  pull_request: {}
  push:
    branches:
      - main

# One run per ref at a time. A superseded pull-request run is cancelled, but
# pushes to main queue instead, so no merge commit is left unvalidated when two
# merges land seconds apart.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew lintDebug
      - name: Assemble debug APK
        run: ./gradlew assembleDebug
